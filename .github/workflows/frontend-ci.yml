name: Frontend CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint and build
        run: npm run check
      - name: Verify publish output
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          test -f dist/favicon.svg
          test -f dist/fonts/archivo-latin-wdth-normal.woff2
