name: One-time Arabic acknowledgement fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-acknowledgement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct daughters wording and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('zak-zok/arabic/standard/book.tex')
          text = path.read_text(encoding='utf-8')
          old = 'لأبنائه'
          new = 'لابنتيه'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/one-time-arabic-ack-fix.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zak-zok/arabic/standard/book.tex .github/workflows/one-time-arabic-ack-fix.yml
          git commit -m "Fix Arabic acknowledgment daughters wording"
          git push origin HEAD:main
